name: Production Smoke Test

on:
  workflow_dispatch:
  schedule:
    # A cada 6 horas
    - cron: '0 */6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # www por padrão: o apex responde 308 → www e o teste não valida redirects
      PROD_URL: ${{ vars.PROD_URL || 'https://www.curriculopolitico.org' }}
    steps:
      - name: Home responde
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "$PROD_URL/")
          echo "home: $code"
          [ "$code" = "200" ] || (echo "FAIL home" && exit 1)

      - name: Ranking responde
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "$PROD_URL/ranking")
          echo "ranking: $code"
          [ "$code" = "200" ] || (echo "FAIL ranking" && exit 1)

      - name: API de busca encontra parlamentar
        run: |
          total=$(curl -sL --max-time 30 "$PROD_URL/api/search?q=lula" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('total', 0))")
          echo "resultados p/ 'lula': $total"
          [ "$total" -ge 1 ] || (echo "FAIL busca" && exit 1)

      - name: API de rankings tem dados
        run: |
          n=$(curl -sL --max-time 30 "$PROD_URL/api/rankings?limit=5" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('ranking', [])))")
          echo "no ranking: $n"
          [ "$n" -ge 1 ] || (echo "FAIL rankings API" && exit 1)

      - name: Página de status degradada = falha
        run: |
          # Lê o health check por CÓDIGO HTTP, não por string na interface.
          #
          # Antes esta checagem baixava /status e fazia `grep` no rótulo
          # "Indisponível". Isso quebra em silêncio: renomear o rótulo na UI faz
          # o monitor passar a dar falso negativo sem ninguém perceber. O
          # /api/health devolve 503 quando o banco está inacessível, quando a
          # base está vazia ou quando o ranking não tem nota publicada — estados
          # que o grep não distinguia.
          code=$(curl -sL -o /tmp/health.json -w "%{http_code}" --max-time 30 "$PROD_URL/api/health")
          echo "health: HTTP $code"
          cat /tmp/health.json; echo
          [ "$code" = "200" ] || (echo "FAIL health degradado" && exit 1)
