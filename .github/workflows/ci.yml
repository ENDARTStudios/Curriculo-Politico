name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma (valida o schema)
        run: npx prisma generate

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Verificação do motor IDIP
        run: npm run verify:scoring

      - name: Build do Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
